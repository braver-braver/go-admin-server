components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: "Server session cookie, HttpOnly and Secure. The development mock uses its own cookie."
  parameters:
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: "Required on every write, checked before the session."
      schema:
        type: string
        const: ReactAdminStarter
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: "The token issued with the current session."
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: "Rejected. The status and `error.code` say why; the operation lists its codes per status in `x-error-codes`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - items
        - meta
    AuditLog:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        actorName:
          type: string
        actorEmail:
          type: string
        action:
          type: string
          enum:
            - auth.sign_in
            - auth.sign_out
            - user.created
            - user.updated
            - user.deleted
            - user.batch_deleted
            - user.status_changed
            - user.invited
            - user.batch_invited
            - system.changed
            - ticket.created
            - ticket.updated
            - ticket.commented
            - ticket.status_changed
            - ticket.assigned
        target:
          type: string
        detail:
          type: string
        ip:
          type: string
      required:
        - id
        - createdAt
        - actorName
        - actorEmail
        - action
        - target
        - detail
        - ip
    AuthUser:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        dataScopes:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              all:
                type: boolean
              self:
                type: boolean
              departments:
                type: array
                items:
                  type: string
            required:
              - all
              - self
              - departments
        routes:
          type: array
          items:
            type: string
        departmentId:
          type: string
        dataScope:
          type: object
          properties:
            all:
              type: boolean
            self:
              type: boolean
            departments:
              type: array
              items:
                type: string
          required:
            - all
            - self
            - departments
      required:
        - id
        - email
        - name
        - roles
        - permissions
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    IdList:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
      required:
        - ids
    Login:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPageCount:
          type: integer
          minimum: 1
      required:
        - page
        - pageSize
        - total
        - totalPageCount
    Permissions:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      required:
        - roles
        - permissions
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        csrfToken:
          type: string
          minLength: 1
      required:
        - user
        - csrfToken
    Success:
      type: object
      properties:
        success:
          type: boolean
          const: true
      required:
        - success
    SystemAccount:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        enabled:
          type: boolean
        departmentId:
          type: string
          minLength: 1
          maxLength: 100
        roleIds:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
        id:
          type: string
          minLength: 1
          maxLength: 100
        protected:
          type: boolean
        resource:
          type: string
          const: accounts
      required:
        - name
        - email
        - enabled
        - departmentId
        - roleIds
        - id
        - protected
        - resource
    SystemAccountCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        enabled:
          type: boolean
        departmentId:
          type: string
          minLength: 1
          maxLength: 100
        roleIds:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - name
        - email
        - enabled
        - departmentId
        - roleIds
        - password
      additionalProperties: false
    SystemAccountUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        enabled:
          type: boolean
        departmentId:
          type: string
          minLength: 1
          maxLength: 100
        roleIds:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - name
        - email
        - enabled
        - departmentId
        - roleIds
      additionalProperties: false
    SystemDepartment:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        code:
          type: string
          pattern: "^[a-z][a-z0-9:_-]{1,79}$"
        parentId:
          type: string
          maxLength: 100
        enabled:
          type: boolean
        id:
          type: string
          minLength: 1
          maxLength: 100
        protected:
          type: boolean
        resource:
          type: string
          const: departments
      required:
        - name
        - code
        - parentId
        - enabled
        - id
        - protected
        - resource
    SystemDepartmentWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        code:
          type: string
          pattern: "^[a-z][a-z0-9:_-]{1,79}$"
        parentId:
          type: string
          maxLength: 100
        enabled:
          type: boolean
      required:
        - name
        - code
        - parentId
        - enabled
      additionalProperties: false
    SystemMenu:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          type: string
          maxLength: 100
        kind:
          type: string
          enum:
            - directory
            - page
        routeId:
          type: string
          maxLength: 100
        enabled:
          type: boolean
        visible:
          type: boolean
        order:
          type: integer
          minimum: 0
          maximum: 9999
        id:
          type: string
          minLength: 1
          maxLength: 100
        protected:
          type: boolean
        resource:
          type: string
          const: menus
      required:
        - name
        - parentId
        - kind
        - routeId
        - enabled
        - visible
        - order
        - id
        - protected
        - resource
    SystemMenuWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          type: string
          maxLength: 100
        kind:
          type: string
          enum:
            - directory
            - page
        routeId:
          type: string
          maxLength: 100
        enabled:
          type: boolean
        visible:
          type: boolean
        order:
          type: integer
          minimum: 0
          maximum: 9999
      required:
        - name
        - parentId
        - kind
        - routeId
        - enabled
        - visible
        - order
      additionalProperties: false
    SystemPermission:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        code:
          type: string
          pattern: "^[a-z][a-z0-9:_-]{1,79}$"
        description:
          type: string
          maxLength: 200
        id:
          type: string
          minLength: 1
          maxLength: 100
        protected:
          type: boolean
        resource:
          type: string
          const: permissions
      required:
        - name
        - code
        - description
        - id
        - protected
        - resource
    SystemPermissionWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        code:
          type: string
          pattern: "^[a-z][a-z0-9:_-]{1,79}$"
        description:
          type: string
          maxLength: 200
      required:
        - name
        - code
        - description
      additionalProperties: false
    SystemRecord:
      oneOf:
        - $ref: "#/components/schemas/SystemAccount"
        - $ref: "#/components/schemas/SystemRole"
        - $ref: "#/components/schemas/SystemPermission"
